# pyproject.toml - v1.3 (Session 21: mypy override 중복 블록 병합 + 전략 모듈 추가)
# 기존 [[tool.mypy.overrides]] ignore_missing_imports 블록이 2개 중복 정의되어
# 있었음. 실제 asyncpg/optuna 무시가 무효화되는 것은 아니지만(두 번째 블록에
# 해당 모듈이 나열되지 않아 매칭 자체가 안 되므로), 동일 목적의 설정이 두 곳에
# 흩어져 향후 한쪽만 수정될 경우 어긋날 위험이 있어 단일 블록으로 병합함.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stock_analyzer_v5"
version = "7.8.0-WIN"
description = "AI 퀀트 트레이딩 시스템 (v7.8.0-WIN)"
readme = "README.md"
requires-python = ">=3.12"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_no_return = true
warn_redundant_casts = false
explicit_package_bases = true
exclude = ["tests/", "venv/", "logs/", "docs/", "fonts/"]

# ─── Session 20/21: 실제 검증·수정 완료된 모듈만 strict 적용 ──────────────────
[[tool.mypy.overrides]]
module = [
    "domain.models.signal",
    "domain.strategies.base",
    "domain.strategies.trend",
    "domain.strategies.reversal",
    "domain.strategies.breakout",
    "filters.macro_filter",
    "filters.sector_filter",
    "filters.stock_filter",
    "filters.korean_special_filter",
    "filters.dynamic_weighter",
    "application.analysis.atr_service",
]
strict = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true


# ─── 외부 패키지 임포트 무시 (단일 블록으로 병합) ──────────────────────────────
[[tool.mypy.overrides]]
module = [
    "telegram.*",
    "aiohttp.*",
    "websockets.*",
    "yfinance.*",
    "apscheduler.*",
    "numpy.*",
    "scipy.*",
    "sklearn.*",
    "xgboost.*",
    "pandas.*",
    "yaml.*",
    "dotenv.*",
    "psutil.*",
    "reportlab.*",
    "asyncpg.*",
    "optuna.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "C", "UP",
]
ignore = [
    "E501", "B008", "C901", "RUF012",
    "E402", "E722", "F841", "B007",
    "RUF001", "RUF003", "RUF005", "RUF006", "RUF013",
]
fixable = ["ALL"]
unfixable = ["C"]

[tool.ruff.lint.isort]
known-first-party = [
    "core", "data", "scanner", "strategy", "orchestrator", "risk",
    "report", "filters", "feedback", "scheduler", "collector",
    "analytics", "validation", "decision", "execution",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"config/*" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --strict-markers --tb=short"
asyncio_mode = "auto"
markers = [
    "unit: 단위 테스트",
    "integration: 통합 테스트",
    "slow: 실행 시간이 긴 테스트",
]
asyncio_default_fixture_loop_scope = "function"
