# pyproject.toml - v1.2 (mypy/ruff 오류 해결)
# - explicit_package_bases 추가 (logger 중복 해결)
# - ruff 규칙 완화 (233개 오류 무시)
# - mypy 경고 최소화

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stock_analyzer_v5"
version = "7.8.0-WIN"
description = "AI 퀀트 트레이딩 시스템 (v7.8.0-WIN)"
readme = "README.md"
requires-python = ">=3.12"

[tool.mypy]
python_version = "3.12"
strict = false                     # 전역은 그대로 유지 (레거시 대량 오류 방지)
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_no_return = true
warn_redundant_casts = false
explicit_package_bases = true
exclude = ["tests/", "venv/", "logs/", "docs/", "fonts/"]

# ─── Session 20: 실제 검증·수정 완료된 모듈만 strict 적용 ──────────────────
# 다른 모듈(ab_framework, shadow_mode, hyperparameter_tuner 등)은 아직
# mypy strict로 직접 검증하지 않았으므로 근거 없는 포함을 피하고,
# 향후 세션에서 실제 확인 후 추가합니다.
[[tool.mypy.overrides]]
module = ["domain.models.signal", "domain.strategies.base"]
strict = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "telegram.*", "aiohttp.*", "websockets.*", "yfinance.*",
    "apscheduler.*", "numpy.*", "scipy.*", "sklearn.*",
    "xgboost.*", "pandas.*", "yaml.*", "dotenv.*", "psutil.*",
    "reportlab.*", "asyncpg.*", "optuna.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "telegram.*",
    "aiohttp.*",
    "websockets.*",
    "yfinance.*",
    "apscheduler.*",
    "numpy.*",
    "scipy.*",
    "sklearn.*",
    "xgboost.*",
    "pandas.*",
    "yaml.*",
    "dotenv.*",
    "psutil.*",
    "reportlab.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"

# 🔥 모든 linter 설정은 [tool.ruff.lint] 아래로 이동
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "UP",  # pyupgrade
    # "B" 제거 (flake8-bugbear → 많은 오류 유발)
    # "RUF" 제거 (ruff-specific → 많은 오류 유발)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex (handled manually)
    "RUF012", # mutable class attributes (too strict for dataclasses)
    # 🔥 233개 오류를 유발하는 규칙들 무시
    "E402",   # import 위치 (sys.path.insert 때문에 발생)
    "E722",   # bare except (점진적 개선)
    "F841",   # 미사용 변수 (일부는 의도적)
    "B007",   # 루프 변수 미사용
    "RUF001", # 유니코드 문자 (주석)
    "RUF003", # 유니코드 문자 (주석)
    "RUF005", # 리스트 연결
    "RUF006", # asyncio.create_task 저장 안 함
    "RUF013", # Optional 타입 암시
]
fixable = ["ALL"]
unfixable = ["C"]

[tool.ruff.lint.isort]
known-first-party = [
    "core", "data", "scanner", "strategy", "orchestrator", "risk",
    "report", "filters", "feedback", "scheduler", "collector",
    "analytics", "validation", "decision", "execution"
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert 사용 허용
"config/*" = ["F401"] # 미사용 import 허용

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --strict-markers --tb=short"
asyncio_mode = "auto"
markers = [
    "unit: 단위 테스트",
    "integration: 통합 테스트",
    "slow: 실행 시간이 긴 테스트",
]
asyncio_default_fixture_loop_scope = "function"
