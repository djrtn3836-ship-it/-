[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stock_analyzer_v5"
version = "7.8.0-WIN"
description = "AI 퀀트 트레이딩 시스템 (v7.8.0-WIN)"
readme = "README.md"
requires-python = ">=3.12"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_no_return = true
warn_redundant_casts = false
explicit_package_bases = true
plugins = ["pydantic.mypy"]
exclude = [
    "tests/", "venv/", "logs/", "docs/", "fonts/",
    "scanner_main.py", "^main\\.py$",
    "analytics/daily_monitor.py",
    "monitor/daily_monitor.py",
    "analytics/shadow_logger.py",
    "monitor/shadow_logger.py",
    "analytics/phase_transition_validator.py",
]

[[tool.mypy.overrides]]
module = [
    "domain.models.signal",
    "domain.strategies.base",
    "domain.strategies.trend",
    "domain.strategies.reversal",
    "domain.strategies.breakout",
    "filters.macro_filter",
    "filters.sector_filter",
    "filters.stock_filter",
    "filters.korean_special_filter",
    "filters.dynamic_weighter",
    "application.analysis.atr_service",
    "application.analysis.signal_pipeline",
    "config.schema",
    "core.logger",
    "scheduler.macro_collector",
    "data.db_manager",
    "core.debug_tower",
    "collector.collector_status",
    "observability.tracer",
    "observability.trace_config",
    "observability.trace_id",
    "observability.trace_propagation",
    "observability.auto_trace",
    "core.blackbox_logger",
    "core.circuit_breaker",
    "monitor.phase_transition_validator",
]
strict = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "telegram.*",
    "aiohttp.*",
    "websockets.*",
    "yfinance.*",
    "apscheduler.*",
    "numpy.*",
    "scipy.*",
    "sklearn.*",
    "xgboost.*",
    "pandas.*",
    "yaml.*",
    "dotenv.*",
    "psutil.*",
    "reportlab.*",
    "asyncpg.*",
    "optuna.*",
    "redis.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "C", "UP",
]
ignore = [
    "E501", "B008", "C901", "RUF012",
    "E402", "E722", "F841", "B007",
    "RUF001", "RUF003", "RUF005", "RUF006", "RUF013",
]
fixable = ["ALL"]
unfixable = ["C"]

[tool.ruff.lint.isort]
known-first-party = [
    "core", "data", "scanner", "strategy", "orchestrator", "risk",
    "report", "filters", "feedback", "scheduler", "collector",
    "analytics", "validation", "decision", "execution",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"config/*" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --strict-markers --tb=short"
asyncio_mode = "auto"
markers = [
    "unit: 단위 테스트",
    "integration: 통합 테스트",
    "slow: 실행 시간이 긴 테스트",
]
asyncio_default_fixture_loop_scope = "function"
