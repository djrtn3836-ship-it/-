# v5.6.6 FINAL - 통합 설정 파일

system:
  name: "국내주식 전방위 감시 시스템"
  version: "5.6.6"
  mode: "shadow"

# 🔥 WebSocket 설정
websocket:
  url: "wss://api.kiwoom.com:10000/api/dostk/websocket"
  ping_interval: 20
  ping_timeout: 60
  login_timeout: 10

# 🔥 Rate Limit
rate_limit:
  capacity: 5
  refill: 5.0

# 🔥 신호 감지
signal:
  price_change_ratio: 0.02
  cooldown_seconds: 300
  emergency_threshold: 0.05
  max_subscriptions: 500

# 🔥 큐 설정
queue_maxsize: 100000

# 🔥 스케줄러
scheduler:
  daily_report_hour: 7
  daily_report_minute: 0
  feedback_hour: 17
  feedback_minute: 0
  weekly_pdf_day: "mon"
  weekly_pdf_hour: 6
  weekly_pdf_minute: 0
  ohlcv_hour: 16
  ohlcv_minute: 30

# 🔥 재연결
reconnect:
  max_attempts: 5
  base_delay: 2
  max_delay: 60
  interval: 30

# 🔥 종목 감시
monitoring:
  tier1_count: 500
  tier2_count: 400
  tier3_count: 1850
  cooldown_seconds: 300

# 🔥 포지션 사이징
position_sizing:
  method: "fractional_kelly"
  kelly_fraction: 0.25
  max_single_position_pct: 8.0
  max_sector_concentration_pct: 25.0

# 🔥 텔레그램
telegram:
  enabled: true
  # chat_id는 .env에서 로드됨

# config/config.yaml - v7.0 (설정 중앙화)

# 기존 설정 (WebSocket, Rate Limit 등)은 그대로 유지
# 아래는 신규 추가되는 트레이딩/전략/리스크 설정

trading:
  # DeepAnalyzer 기본값
  max_hold_hours: 2.0
  trail_aggressive_threshold: 5.0
  atr_multiplier_stop: 2.0
  atr_multiplier_trail: 1.5
  atr_spike_threshold: 0.3

  # 가중치 (ML/전략 등)
  momentum_weight: 0.08
  ml_weight: 0.18
  sentiment_weight: 0.02
  base_weight: 0.42
  strategy_weight: 0.30

  # 체결/주문량
  fill_ratio_reject: 0.30
  fill_ratio_reduce: 0.70
  order_volume_ratio: 0.008
  order_volume_min: 10
  order_volume_max: 500

strategy:
  # 전략별 기본 가중치 (strategies.yaml에서 덮어쓰기 가능)
  default_trend_weight: 0.40
  default_reversal_weight: 0.30
  default_breakout_weight: 0.30

risk:
  # VaR 기본값 (portfolio_var.py에서 사용)
  var_confidence: 0.95
  var_num_simulations: 10000
  var_lookback_days: 252
  var_update_interval: 300
