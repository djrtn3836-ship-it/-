# GenSpark AI Developer - Configuration
# v6.2.0 (Session 60)

# === System Configuration ===
debug: false
log_level: INFO
timezone: Asia/Seoul

# === Kiwoom API Configuration ===
kiwoom:
  account_number: ""
  api_key: ""
  use_mock: false

# === Market Data Configuration ===
market:
  max_subscriptions: 195
  price_change_ratio: 0.02
  cooldown_seconds: 300
  emergency_threshold: 0.05

# === Data Source ===
data:
  dart_enabled: true
  news_crawler_enabled: false
  sentiment_analysis_enabled: false

# === Database ===
database:
  type: sqlite
  path: ./data/decisions.db
  pool_size: 5

# === Monitoring ===
monitoring:
  enabled: true
  alert_telegram: false
  alert_email: false

# === Performance ===
performance:
  max_workers: 4
  cache_ttl: 3600
  batch_size: 100