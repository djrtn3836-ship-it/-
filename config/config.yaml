# v5.6.6 FINAL - 통합 설정 파일

system:
  name: "국내주식 전방위 감시 시스템"
  version: "5.6.6"
  mode: "shadow"

# 🔥 WebSocket 설정
websocket:
  url: "wss://api.kiwoom.com:10000/api/dostk/websocket"
  ping_interval: 20
  ping_timeout: 60
  login_timeout: 10

# 🔥 Rate Limit
rate_limit:
  capacity: 5
  refill: 5.0

# 🔥 신호 감지
signal:
  price_change_ratio: 0.02
  cooldown_seconds: 300
  emergency_threshold: 0.05
  max_subscriptions: 500

# 🔥 큐 설정
queue_maxsize: 100000

# 🔥 스케줄러
scheduler:
  daily_report_hour: 7
  daily_report_minute: 0
  feedback_hour: 17
  feedback_minute: 0
  weekly_pdf_day: "mon"
  weekly_pdf_hour: 6
  weekly_pdf_minute: 0
  ohlcv_hour: 16
  ohlcv_minute: 30

# 🔥 재연결
reconnect:
  max_attempts: 5
  base_delay: 2
  max_delay: 60
  interval: 30

# 🔥 종목 감시
monitoring:
  tier1_count: 500
  tier2_count: 400
  tier3_count: 1850
  cooldown_seconds: 300

# 🔥 포지션 사이징
position_sizing:
  method: "fractional_kelly"
  kelly_fraction: 0.25
  max_single_position_pct: 8.0
  max_sector_concentration_pct: 25.0

# 🔥 텔레그램
telegram:
  enabled: true
  # chat_id는 .env에서 로드됨