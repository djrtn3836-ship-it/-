name: CI

on:
  push:
    branches: [genspark_ai_developer, main]
  pull_request:
    branches: [genspark_ai_developer, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio ruff

      - name: Static analysis (ruff F — 실버그 규칙)
        run: ruff check . --select F

      - name: Verify encoding (UTF-8, no BOM) and syntax
        run: |
          python - <<'PY'
          import ast, os, sys
          bad, bom, n, flat = [], 0, 0, []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in ("venv", "__pycache__", ".git", "fonts", "_archive", "logs", "reports")]
              for fn in files:
                  if not fn.endswith(".py"):
                      continue
                  p = os.path.join(root, fn)
                  n += 1
                  raw = open(p, "rb").read()
                  if raw.startswith(b"\xef\xbb\xbf"):
                      bom += 1
                  # 줄바꿈이 사라진(뭉개진) 파일 탐지 — 첫 '#' 주석이 파일 전체를
                  # 삼키면 ast.parse가 '빈 모듈'로 통과하는 거짓 통과가 발생한다.
                  if len(raw) > 200 and raw.count(b"\n") == 0:
                      flat.append(p)
                      continue
                  try:
                      tree = ast.parse(raw.decode("utf-8"))
                  except SyntaxError as e:
                      bad.append((p, e.lineno, e.msg))
                      continue
                  # 코드가 있는데 파싱 결과가 비어 있으면(주석에 삼켜짐) 실패로 간주
                  if len(raw) > 200 and not tree.body:
                      flat.append(p)
          print(f"py={n} BOM={bom} syntax_errors={len(bad)} flattened={len(flat)}")
          for b in bad:
              print("  syntax:", b)
          for f in flat:
              print("  flattened:", f)
          sys.exit(1 if bad or bom or flat else 0)
          PY

      - name: Detect unawaited coroutines (silent no-op)
        run: |
          python - <<'PY'
          import ast, os, sys
          hits = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in ("venv", "__pycache__", ".git", "fonts", "_archive", "logs", "reports", "tests")]
              for fn in files:
                  if not fn.endswith(".py"):
                      continue
                  p = os.path.join(root, fn)
                  try:
                      tree = ast.parse(open(p, encoding="utf-8").read())
                  except SyntaxError:
                      continue
                  for cls in [n for n in ast.walk(tree) if isinstance(n, ast.ClassDef)]:
                      am = {m.name for m in cls.body if isinstance(m, ast.AsyncFunctionDef)}
                      for node in ast.walk(cls):
                          if isinstance(node, ast.Expr) and isinstance(node.value, ast.Call):
                              f = node.value.func
                              if isinstance(f, ast.Attribute) and isinstance(f.value, ast.Name) \
                                 and f.value.id == "self" and f.attr in am:
                                  hits.append(f"{p}:{node.lineno} self.{f.attr}()")
          print(f"unawaited_coroutines={len(hits)}")
          for h in hits:
              print("  unawaited:", h)
          sys.exit(1 if hits else 0)
          PY

      - name: Run tests
        run: python tests/run_all.py
