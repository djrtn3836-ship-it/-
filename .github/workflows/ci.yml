name: CI

on:
  push:
    branches: [genspark_ai_developer, main]
  pull_request:
    branches: [genspark_ai_developer, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio ruff

      - name: Static analysis (ruff F — 실버그 규칙)
        run: ruff check . --select F

      - name: Static source checks (BOM/syntax/flattened/unawaited)
        run: python tests/run_all.py --check-only

      - name: Run tests
        run: python tests/run_all.py
